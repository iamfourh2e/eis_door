services:
  zkbio-mock:
    image: doorwatch-local:latest
    build: .
    command: ["node", "server/mock-zkbio.mjs"]
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      MOCK_ZKBIO_PORT: 8080
      MOCK_ZKBIO_TOKEN: demo-token
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - doorwatch-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  doorwatch:
    image: doorwatch-local:latest
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      zkbio-mock:
        condition: service_healthy
    ports:
      - "${DOORWATCH_WEB_PORT:-3080}:3000"
      - "4000:4000"
    environment:
      API_PORT: 4000
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-doorwatch}
      ZKBIO_ENABLED: ${ZKBIO_ENABLED:-true}
      ZKBIO_BASE_URL: ${ZKBIO_BASE_URL:-}
      ZKBIO_ACCESS_TOKEN: ${ZKBIO_ACCESS_TOKEN:-}
      ZKBIO_POLL_INTERVAL_MS: 10000
      ZKBIO_REQUEST_TIMEOUT_MS: ${ZKBIO_REQUEST_TIMEOUT_MS:-8000}
      ZKBIO_ALLOW_INSECURE_TLS: ${ZKBIO_ALLOW_INSECURE_TLS:-false}
      ZKBIO_SIMULATOR_URL: http://zkbio-mock:8080
      ZKBIO_SIMULATOR_TOKEN: demo-token
      COLLECTOR_ID: ${COLLECTOR_ID:-doorwatch-local-01}
      CENTRAL_SERVER_URL: ${CENTRAL_SERVER_URL:-}
      CENTRAL_SERVER_KEY: ${CENTRAL_SERVER_KEY:-}
      CONFIG_KEY_PATH: /app/server-data/config.key
      SESSION_KEY_PATH: /app/server-data/session.key
      SESSION_HOURS: ${SESSION_HOURS:-12}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-DoorWatch@123}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    volumes:
      - doorwatch-secrets:/app/server-data

volumes:
  doorwatch-mongo:
  doorwatch-secrets:
